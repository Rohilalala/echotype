<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Intro preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Stand-in desktops for checking the film over light and dark screens (preview only). */
  body[data-bg="dark"] { background: radial-gradient(120% 90% at 30% 20%, #2b3a55 0%, #121826 55%, #07090f 100%); }
  body[data-bg="light"] { background: #e9e9ec; }
  body[data-bg="light"] .win { position: absolute; inset: 9% 14% 14% 12%; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
  body[data-bg="light"] .win::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 38px; background: #f4f4f6; border-radius: 12px 12px 0 0; border-bottom: 1px solid #e3e3e6; }
  body[data-bg="light"] .win i { position: absolute; left: 8%; right: 30%; height: 10px; border-radius: 5px; background: #ececef; }
  canvas, .veil { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  /* The veil: the desktop dimmed like cinema lights going down, darker at the edges. */
  /* The ball's backing: the idle pill's dark disc, fading in as the last stars land. */
  .disc { position: fixed; border-radius: 50%; background: rgba(0,0,0,.78); box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 6px 24px rgba(0,0,0,.35); opacity: 0; transform: translate(-50%, -50%); }
  .veil { background: radial-gradient(130% 110% at 50% 55%, rgba(4,6,12,.62) 0%, rgba(2,3,8,.86) 70%, rgba(0,0,0,.94) 100%); opacity: 0; }
</style>
</head>
<body data-bg="dark">
<div class="win"><i style="top:80px"></i><i style="top:104px;right:45%"></i><i style="top:128px"></i><i style="top:176px;right:38%"></i></div>
<div class="veil" id="veil"></div>
<div class="disc" id="disc"></div>
<canvas id="c"></canvas>
<script type="module">
import { createIntro, veilAt } from './intro.js';
const q = new URLSearchParams(location.search);
document.body.dataset.bg = q.get('bg') || 'dark';
const intro = createIntro(document.getElementById('c'), { dpr: Number(q.get('dpr')) || undefined });
const veil = document.getElementById('veil'), strength = q.has('veil') ? Number(q.get('veil')) : 0.15;
const disc = document.getElementById('disc');
const placeDisc = () => { const b = intro.ballAt(); Object.assign(disc.style, { left: b.x + 'px', top: b.y + 'px', width: b.r * 2.3 + 'px', height: b.r * 2.3 + 'px' }); };
placeDisc();
window.__draw = t => {
  intro.draw(t);
  veil.style.opacity = veilAt(t, intro.timeline.formed) * strength;
  const f = intro.timeline.formed;
  disc.style.opacity = Math.min(1, Math.max(0, (t - f + 0.5) / 0.7));
};
if (q.has('t')) window.__draw(Number(q.get('t')));
// Plays on a loop (10 s) so it can be watched over and over; click to restart.
else { let t0 = performance.now(); addEventListener('click', () => (t0 = performance.now())); const loop = () => { window.__draw(((performance.now() - t0) / 1000) % 10); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
