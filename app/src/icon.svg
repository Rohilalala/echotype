<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F6"/>
      <stop offset="1" stop-color="#E1E2E1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <!-- macOS grid: 824 px pewter body, 100 px margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#1D2024" stroke-opacity="0.1"/>
  <!-- the E's open side is the meter's scale -->
  <g stroke="#666A6F" stroke-width="12" stroke-linecap="round">
    <line x1="737" y1="320" x2="763" y2="309"/>
    <line x1="768" y1="414" x2="795" y2="408"/>
    <line x1="768" y1="512" x2="806" y2="512"/>
    <line x1="768" y1="610" x2="795" y2="616"/>
    <line x1="737" y1="704" x2="763" y2="715"/>
  </g>
  <!-- the settled letter, in ink -->
  <path fill="#0F4C81" d="M262 262H610a12 12 0 0 1 12 12V346a12 12 0 0 1-12 12H362V666H642a12 12 0 0 1 12 12V750a12 12 0 0 1-12 12H262a12 12 0 0 1-12-12V274a12 12 0 0 1 12-12Z"/>
  <!-- its middle arm is the live needle, in molten bronze, pivoting on the stem -->
  <line x1="306" y1="512" x2="729" y2="445" stroke="#9A6A35" stroke-width="38" stroke-linecap="round"/>
  <circle cx="306" cy="512" r="40" fill="#9A6A35"/>
</svg>
