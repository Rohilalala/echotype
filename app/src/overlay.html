<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Echotype overlay</title>
<link rel="icon" href="data:," />
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Every capsule is centred on one line 16 px above the window's bottom edge (pill.rs ANCHOR),
     so the margins below differ by height; the card grows up from that line. */
  body {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    font: 500 11px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  /* The body (ball, orb disc, capsule, card) is drawn on #body by overlay.js, which follows this
     element's box, so .pill itself is transparent and only lays out. Sizes match pill.rs (its hit
     areas): idle ball 10 (hit 24x22), orb 36 (recording 96 wide with ✕ and ✓), any line of text
     22 tall and at most 240 wide. */
  #body { position: fixed; left: 0; top: 0; width: 260px; height: 100px; pointer-events: none; }
  .pill {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    /* The idle ball: 10 px times its own scale (Settings → Pill), centred 16 px above the bottom. */
    width: calc(10px * var(--ball, 1));
    height: calc(10px * var(--ball, 1));
    max-width: 240px;
    padding: 0;
    box-sizing: border-box;
    margin-bottom: calc(16px - 5px * var(--ball, 1));
    position: relative;
    border-radius: 11px;
    color: rgba(255, 255, 255, 0.94);
    overflow: hidden;
    transition: transform 0.12s ease;
  }
  .pill > * { display: none; animation: show 0.16s ease-out 0.14s backwards; }
  @keyframes show { from { opacity: 0; } }
  /* Picked up: a little larger, so it reads as held while it moves. */
  .pill.drag { transform: scale(1.15); }
  /* A line of text can be 240 wide in a 260 window: it lifts less, so it is never cut off. */
  .pill.drag.active:not([data-state="recording"]) { transform: scale(1.06); }
  /* Idle, hovered for 200 ms: the hint. */
  .pill.expand { width: auto; height: 22px; margin-bottom: 5px; padding: 0 10px; }
  .pill.expand .label { display: block; }
  /* Any dictation state: a line of text plus at most one chip. */
  .pill.active { width: auto; height: 22px; margin-bottom: 5px; padding: 0 10px; }
  .pill.active .label, .pill.active .secs { display: block; }
  .secs { white-space: nowrap; flex: none; color: rgba(255, 255, 255, 0.62); font-variant-numeric: tabular-nums; }
  .pill.active .chip:not([hidden]) { display: block; }
  /* The orb (overlay.js draws it): listening, then thinking. While listening, hovering (or
     hands-free) opens ✕ and ✓ either side of it. The line stays for screen readers only. */
  .pill.active.orb { width: 36px; height: 36px; padding: 0 4px; gap: 0; justify-content: space-between; }
  .pill.active.orb[data-state="recording"]:is(.hover, .locked) { width: 96px; }
  .pill.active.orb :is(.label, .secs, .chip) { display: block; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .pill.active.orb[data-state="recording"]:is(.hover, .locked) .btn:is(.x, .ok) { display: flex; }
  /* Listening with the words so far (pill.rs live_w): the orb sits in .spot, the words to its
     right, one line, dimmer than a notice; ✕ and ✓ open at the ends as without them. */
  .pill.active.orb.live { width: auto; padding: 0 10px 0 0; justify-content: flex-start; }
  .pill.active.orb.live:is(.hover, .locked) { width: auto; padding: 0 10px 0 0; }
  .pill.active.orb.live :is(.spot, .said) { display: block; }
  .pill.active.orb.live .btn.ok { margin-left: 4px; }
  .spot { width: 36px; height: 36px; flex: none; }
  .said { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; line-height: 15px; color: rgba(255, 255, 255, 0.7); }
  /* Pasted: back to the ball at once; the line is still announced. */
  .pill.active.collapse { width: calc(10px * var(--ball, 1)); height: calc(10px * var(--ball, 1)); margin-bottom: calc(16px - 5px * var(--ball, 1)); padding: 0; }
  .pill.active.collapse :is(.label, .secs, .chip) { display: block; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  /* Muted: the question in words, between ✕ and ✓. */
  .pill.active[data-state="recording"].muted { gap: 4px; padding: 0 2px; }
  .pill.active[data-state="recording"].muted .btn:is(.x, .ok) { display: flex; }

  .btn {
    width: 16px; height: 16px; flex: none; padding: 0; border: 0; border-radius: 8px;
    align-items: center; justify-content: center;
    background: transparent; color: rgba(255, 255, 255, 0.85);
    opacity: 0; transition: opacity 0.12s ease-out, background-color 0.12s ease-out;
  }
  .btn svg { width: 8px; height: 8px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .pill.hover .btn { opacity: 1; }
  .pill.hover .btn:hover { background: rgba(255, 255, 255, 0.16); }
  /* D5: hands-free has no key to let go of, so ✓ stays in sight. */
  .pill.locked .btn.ok { opacity: 1; background: rgba(255, 255, 255, 0.16); }


  /* The primary line keeps its words; the chip gives way first. */
  .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; max-width: 100%; letter-spacing: 0; }
  .chip { white-space: nowrap; color: rgba(255, 255, 255, 0.6); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .chip::before { content: "·"; margin-right: 6px; color: rgba(255, 255, 255, 0.35); }
  .chip[data-chip="too_quiet"] { color: #ffd59a; }
  .pill[data-state="error"] .label { color: #ffd59a; }
  .pill[data-state="transcribing"] .label, .pill[data-state="cleaning"] .label { color: rgba(255, 255, 255, 0.8); }

  /* Nowhere to paste: the transcript (two lines at most), a 6 s countdown ring, the paste-last
     shortcut and Copy, which is the one thing to do here, so it is the only filled control.
     Sizes match pill.rs (CARD_W, 42 + 15 per line). */
  .pill.active.card { flex-direction: column; align-items: stretch; width: 240px; height: auto; padding: 8px 10px 6px; gap: 6px; border-radius: 10px; transform-origin: 50% 100%; }
  /* The orb's dots fly out to the card's edge first (overlay.js); then its words arrive. */
  .pill.active.card > * { animation-delay: 0.36s; }
  .pill.active.card :is(.label, .secs, .chip) { display: none; }
  .pill.active.card .ctext { display: -webkit-box; }
  .pill.active.card .creason { display: block; }
  .pill.active.card .fix:not([hidden]) { display: block; }
  .pill.active.card .crow, .pill.active.card .close { display: flex; }
  /* Why it could not paste, in one line; amber when the user can fix it (Accessibility). */
  .creason { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 15px; padding-right: 18px; color: rgba(255, 255, 255, 0.62); }
  .creason.fixable { color: #ffd59a; }
  .fix { height: 20px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: #ffd59a; font: inherit; box-shadow: inset 0 0 0 1px rgba(255, 213, 154, 0.4); }
  .fix:hover { background: rgba(255, 213, 154, 0.14); }
  .ctext { -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; white-space: normal; line-height: 15px; padding-right: 18px; color: rgba(255, 255, 255, 0.94); }
  .crow { align-items: center; gap: 6px; height: 22px; }
  .ring { width: 12px; height: 12px; flex: none; }
  .ring circle { fill: none; stroke-width: 1.5; }
  .ring .track { stroke: rgba(255, 255, 255, 0.18); }
  .ring .left { stroke: rgba(255, 255, 255, 0.7); stroke-dasharray: 28.27; transform: rotate(-90deg); transform-origin: 6px 6px; animation: ring 6s linear forwards; }
  .pill.hover .ring .left { animation-play-state: paused; }
  .ckey { white-space: nowrap; color: rgba(255, 255, 255, 0.62); }
  .copy { margin-left: auto; height: 20px; padding: 0 9px; border: 0; border-radius: 6px; background: rgba(255, 255, 255, 0.16); color: rgba(255, 255, 255, 0.94); font: inherit; }
  .copy:hover { background: rgba(255, 255, 255, 0.24); }
  /* A detected call's offer: Not now beside Start notes (or Stop notes) in place of Copy. */
  .later { margin-left: auto; height: 20px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: rgba(255, 255, 255, 0.7); font: inherit; }
  .later:hover { background: rgba(255, 255, 255, 0.12); }
  .later:not([hidden]) + .copy { margin-left: 0; }
  .pill.active.card .close { position: absolute; top: 6px; right: 6px; opacity: 0.7; }
  .pill.active.card .close:hover { opacity: 1; background: rgba(255, 255, 255, 0.16); }
  @keyframes ring { to { stroke-dashoffset: 28.27; } }

  @media (prefers-reduced-motion: reduce) {
    .pill > * { animation: none; }
    .btn, .pill { transition: none; }
    .pill.drag { transform: none; }
  }
</style>
</head>
<body>
  <canvas id="body" aria-hidden="true"></canvas>
  <div class="pill" id="pill" data-state="idle" role="group" aria-label="Start dictation">
    <button class="btn x" type="button" data-act="cancel" aria-label="Cancel dictation" title="Cancel"><svg viewBox="0 0 8 8"><path d="M1 1l6 6M7 1L1 7"/></svg></button>
    <span class="spot" id="spot" aria-hidden="true"></span>
    <span class="said" id="said" aria-hidden="true"></span>
    <span class="label" id="label" role="status" aria-live="polite"></span>
    <span class="secs" id="secs" aria-hidden="true"></span>
    <span class="chip" id="chip" hidden></span>
    <button class="btn ok" type="button" data-act="finish" aria-label="Finish dictation" title="Finish"><svg viewBox="0 0 8 8"><path d="M1 4.2l2 2L7 1.8"/></svg></button>
    <span class="creason" id="creason"></span>
    <span class="ctext" id="ctext"></span>
    <span class="crow"><svg class="ring" viewBox="0 0 12 12" aria-hidden="true"><circle class="track" cx="6" cy="6" r="4.5"/><circle class="left" id="ringLeft" cx="6" cy="6" r="4.5"/></svg><span class="ckey" id="ckey"></span><button class="fix" id="fix" type="button" data-act="fix" hidden>Turn on</button><button class="later" id="later" type="button" data-act="close" hidden>Not now</button><button class="copy" id="copy" type="button" data-act="copy">Copy</button></span>
    <button class="btn close" type="button" data-act="close" aria-label="Close" title="Close"><svg viewBox="0 0 8 8"><path d="M1 1l6 6M7 1L1 7"/></svg></button>
  </div>
<script type="module" src="overlay.js"></script>
</body>
</html>
