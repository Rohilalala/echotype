<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Echotype overlay</title>
<link rel="icon" href="data:," />
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 36px;
    padding: 0 16px 0 13px;
    border-radius: 18px;
    background: rgba(24, 24, 26, 0.9);
    color: #f4f4f5;
    /* inner hairline reads on dark wallpapers, outer one and the shadow on light ones */
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.28);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    backdrop-filter: blur(16px) saturate(1.4);
    opacity: 0;
    transform: translateY(6px) scale(0.97);
    transition: opacity 0.16s ease-out, transform 0.16s ease-out;
    max-width: calc(100vw - 24px);
  }
  .pill.on { opacity: 1; transform: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5f; flex: none; box-shadow: 0 0 0 3px rgba(255, 90, 95, 0.22); }
  .meter { display: flex; align-items: center; gap: 2.5px; height: 18px; flex: none; }
  .meter i { width: 3px; height: 100%; border-radius: 1.5px; background: #f4f4f5; transform: scaleY(0.14); transition: transform 0.09s linear; }
  .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.005em; }

  [data-state="transcribing"] .dot, [data-state="cleaning"] .dot { background: #3cc2b1; box-shadow: 0 0 0 3px rgba(60, 194, 177, 0.22); }
  [data-state="transcribing"] .meter i, [data-state="cleaning"] .meter i { transition: none; animation: wave 1s ease-in-out infinite; opacity: 0.85; }
  [data-state="done"] .dot { background: #4cc77a; box-shadow: 0 0 0 3px rgba(76, 199, 122, 0.22); }
  [data-state="done"] .meter, [data-state="error"] .meter { display: none; }
  [data-state="error"] .dot { background: #f2a93b; box-shadow: 0 0 0 3px rgba(242, 169, 59, 0.22); }
  [data-state="error"] .label { color: #ffd59a; }
  .meter i:nth-child(2) { animation-delay: 0.08s; } .meter i:nth-child(3) { animation-delay: 0.16s; }
  .meter i:nth-child(4) { animation-delay: 0.24s; } .meter i:nth-child(5) { animation-delay: 0.32s; }
  .meter i:nth-child(6) { animation-delay: 0.40s; } .meter i:nth-child(7) { animation-delay: 0.48s; }
  @keyframes wave { 0%, 100% { transform: scaleY(0.14); } 40% { transform: scaleY(0.55); } }
  @media (prefers-reduced-motion: reduce) {
    .pill, .meter i { transition: none !important; animation: none !important; }
    [data-state="transcribing"] .meter i, [data-state="cleaning"] .meter i { transform: scaleY(0.3); }
  }
</style>
</head>
<body>
  <div class="pill" id="pill" data-state="idle" role="status" aria-live="polite">
    <span class="dot"></span>
    <span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="label" id="label"></span>
  </div>
<script type="module">
  if (!window.__TAURI__) await import('./mock.js');
  const { listen } = window.__TAURI__.event;
  const pill = document.getElementById('pill'), label = document.getElementById('label');
  const bars = [...pill.querySelectorAll('.meter i')];
  const WEIGHT = [0.5, 0.75, 0.95, 1, 0.9, 0.7, 0.5];
  const TEXT = { recording: 'Listening', transcribing: 'Transcribing', cleaning: 'Cleaning up', done: 'Pasted' };
  let smooth = 0;

  listen('dictation-state', ({ payload: p }) => {
    pill.dataset.state = p.state;
    pill.classList.toggle('on', p.state !== 'idle');
    label.textContent = p.state === 'error' ? p.error || 'Something went wrong' : TEXT[p.state] ?? '';
    if (p.state !== 'recording') bars.forEach(b => (b.style.transform = ''));
  });

  // ~20 Hz. Square root lifts quiet speech; the CSS transition fills the gaps between events.
  listen('audio-level', ({ payload }) => {
    if (pill.dataset.state !== 'recording') return;
    smooth = smooth * 0.4 + Math.sqrt(Math.max(0, Math.min(1, payload.level))) * 0.6;
    bars.forEach((b, i) => {
      const s = Math.max(0.14, Math.min(1, smooth * WEIGHT[i] * (0.7 + Math.random() * 0.6)));
      b.style.transform = `scaleY(${s.toFixed(3)})`;
    });
  });
</script>
</body>
</html>
