[package]
name = "echotype"
version = "0.1.0"
description = "Free, local-first voice dictation with any model"
authors = ["Aditya Rohilla"]
license = "MIT"
edition = "2024"

[lib]
name = "echotype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Echotype Cloud (cloud.rs, server/): the provider, sign-in and plans. Off for the launch build.
cloud = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
enigo = "0.6"
arboard = "3"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "mp3", "ogg", "wav", "flac", "vorbis", "pcm", "mkv"] }
symphonia-adapter-libopus = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "multipart", "json"] }
tokio = { version = "1", features = ["net", "sync"] }
getrandom = "0.4"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# ponytail: whisper-rs 0.16 bundles whisper.cpp 1.8.3, whose Metal tensor-API probe fails on M5 GPUs
# (~630 ms warm for 15 s of audio vs ~300 ms encode on whisper.cpp 1.8.6). Bump when whisper-rs ships >= 1.8.6.
whisper-rs = { version = "0.16", features = ["metal"] }
libc = "0.2"
core-graphics = "0.25"
core-foundation = "0.10"
# Objective-C blocks for AVCaptureDevice requestAccessForMediaType:completionHandler: (already in the tree via tauri).
block2 = "0.6"
# Pinned: the pill is a non-activating NSPanel; 2.1.1 is the version the panel spike verified.
tauri-nspanel = "=2.1.1"
# Meeting notes: system audio (ScreenCaptureKit; MIT OR Apache-2.0) and local speaker diarization
# (sherpa-onnx static libs, Apache-2.0, with onnxruntime, MIT; sherpa-rs is MIT).
screencapturekit = "11"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static", "sys"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# whisper-rs 0.16 bundles whisper.cpp 1.8.3, whose Metal probe turns the tensor API off on M5
# (encoder 585 ms vs 272 ms on 1.9.5 for the same clip). Same crate, newer whisper.cpp (submodule).
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
