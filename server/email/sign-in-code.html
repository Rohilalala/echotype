<!DOCTYPE html>
<!-- Supabase Auth email ("Magic Link" and "Confirm signup" templates), sent through Resend.
     {{ .Token }} is the 6-digit code. Push changes with the management API (PATCH
     /v1/projects/<ref>/config/auth: mailer_templates_magic_link_content and _confirmation_content).
     Tables, bgcolor and inline styles because email apps ignore <style> blocks and modern layout.
     orb.gif is the app's own onboarding orb (app/src/orb.js) recorded frame by frame: sphere,
     globe, ring, morph, thinking, check, ball. Frame one is the sphere, which Outlook shows still. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Your Echotype sign-in code</title>
</head>
<body bgcolor="#000000" style="margin:0;padding:0;background-color:#000000;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#000000;">{{ .Token }} is your Echotype sign-in code.&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#000000" style="background-color:#000000;">
  <tr>
    <td align="center" bgcolor="#000000" style="background-color:#000000;padding:40px 24px 56px 24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:420px;">
        <tr>
          <td align="center" style="padding:0;">
            <img src="https://pub-da62fbe34de644598313554b0a5ccc51.r2.dev/email/orb.gif" width="240" height="240" alt="" style="display:block;width:240px;height:240px;border:0;outline:none;">
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:28px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#a1a1aa;">
            Here's your code to sign in to Echotype.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 0 0 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#141416" style="background-color:#141416;border:1px solid #26262b;border-radius:16px;padding:22px 12px 22px 28px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:44px;line-height:52px;font-weight:300;letter-spacing:16px;color:#ffffff;font-variant-numeric:tabular-nums;">
                  <span style="color:#ffffff;text-decoration:none;">{{ .Token }}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:22px;color:#71717a;">
            It works for the next 10 minutes.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:52px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#71717a;">
            Didn't ask for this? You can ignore it.<br>Nobody can sign in without the code.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:28px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#52525b;">
            Echotype, dictation that stays on your Mac.<br>
            <a href="https://tryechotype.tech" style="color:#71717a;text-decoration:underline;">tryechotype.tech</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
