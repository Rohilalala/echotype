name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # A manual run from a branch would publish a release tagged with the branch name.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          # ponytail: no Windows ARM64 yet. ggml needs clang-cl there and cmake-rs pins the VS
          # toolset, so it takes a Ninja + clang-cl cross build (vcvars x64_arm64) to add it.
          - os: windows-latest
            args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true # app/src-tauri/vendor/whisper-rs-sys/whisper.cpp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev libssl-dev cmake clang
      # Whisper's CPU code for any AVX2 PC, not just the build machine's CPU (cross builds already are).
      - name: Portable CPU build
        if: runner.os != 'macOS'
        shell: bash
        run: echo GGML_NATIVE=OFF >> "$GITHUB_ENV"
      # ggml's Vulkan shader tool builds deep inside cargo's target dir, past the 260 characters
      # MSBuild's file tracker can handle (FTK1011): build in a short folder on Windows.
      - name: Short build path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"
      - name: Vulkan SDK, for the Windows GPU build (and Lavapipe, a software GPU for the smoke test)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.341.1
          install_runtime: true
          install_lavapipe: false
          cache: true
      - name: llama-server sidecar for the built-in cleanup model
        if: runner.os != 'Linux'
        shell: bash
        run: |
          case "$ARGS" in --target*) app/scripts/build-llama-server.sh "${ARGS#--target }" ;; *) app/scripts/build-llama-server.sh ;; esac
        env:
          ARGS: ${{ matrix.args }}
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Echotype ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

  # A manual run from a branch: the Windows and Linux installers as workflow artifacts, never a release.
  dry-run:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            args: --bundles appimage,deb
          - os: windows-latest
            name: windows-x64
            args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true # app/src-tauri/vendor/whisper-rs-sys/whisper.cpp
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev libssl-dev cmake clang
      # Whisper's CPU code for any AVX2 PC, not just the build machine's CPU (cross builds already are).
      - name: Portable CPU build
        if: runner.os != 'macOS'
        shell: bash
        run: echo GGML_NATIVE=OFF >> "$GITHUB_ENV"
      # ggml's Vulkan shader tool builds deep inside cargo's target dir, past the 260 characters
      # MSBuild's file tracker can handle (FTK1011): build in a short folder on Windows.
      - name: Short build path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"
      - name: Vulkan SDK, for the Windows GPU build (and Lavapipe, a software GPU for the smoke test)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.341.1
          install_runtime: true
          install_lavapipe: false
          cache: true
      - name: llama-server sidecar for the built-in cleanup model
        if: runner.os == 'Windows'
        shell: bash
        run: app/scripts/build-llama-server.sh
      - run: npm ci
        working-directory: app
      - run: npm run tauri build -- ${{ matrix.args }}
        working-directory: app
      # What the installers pack: the cleanup runner and the Vulkan loader beside the app. (A silent
      # install here waits forever on an elevation prompt, so the build folder is checked instead.)
      - name: The cleanup runner and the Vulkan loader ship next to Echotype.exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="$(cygpath -u "$CARGO_TARGET_DIR")/release"
          ls "$dir"
          test -f "$dir/echotype.exe" && test -f "$dir/llama-server.exe" && test -f "$dir/vulkan-1.dll"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: echotype-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
            app/src-tauri/target/**/release/bundle/deb/*.deb
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            C:/t/release/bundle/msi/*.msi
            C:/t/release/bundle/nsis/*.exe
